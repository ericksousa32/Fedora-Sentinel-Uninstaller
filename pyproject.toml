[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fedora-sentinel-uninstaller"
version = "0.1.0.dev0"
description = "An intelligent, safe and surgical tool for cleaning up residual data on Fedora Linux."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
# No runtime dependencies: Python standard library only.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fsu = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "fedora: integration tests that need a real Fedora system (rpm, dnf5)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "S", "RUF"]
ignore = [
    "S603", # subprocess without a shell: intentional and controlled in fsu.system
    "RUF001", "RUF002", "RUF003", # non-ASCII characters in test data and output
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S311"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
files = ["src", "tests"]

